[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabricated"
version = "0.1.0"
description = "Offline video voice isolation and speech cleanup pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "PyYAML>=6.0,<7.0",
  "numpy>=1.26,<2.0",
  "soundfile>=0.12,<0.13",
  "clearvoice==0.1.2",
  "deepfilternet==0.5.6",
  "faster-whisper==1.2.1",
  "yt-dlp>=2026.3.17",
]

[project.scripts]
fabricated = "fabricated.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fabricated = ["presets/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
